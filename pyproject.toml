[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor"
version = "0.1.0"
description = "Crawl a website, run axe-core accessibility checks, and report the results."
readme = "README.md"
requires-python = ">=3.10"
# Keep in sync with requirements.txt (which pins the exact versions for dev/CI).
dependencies = [
    "playwright==1.65.2",
    "axe-playwright-python==0.1.8",
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
